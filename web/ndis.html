<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Common Ground — NDIS Tracker</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤝</text></svg>">
<!--__CSS__-->
</head>
<body>
<!--__BODY_START__-->
<div class="app" id="app">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="masthead" role="banner">
    <p class="masthead-overline"><a href="./index.html">Common Ground</a></p>
    <p class="masthead-edition" id="mastheadEdition"></p>
    <div class="masthead-top">
      <h1 class="masthead-title">NDIS Tracker</h1>
      <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle colour theme">
        <span class="theme-toggle-icon" id="themeToggleIcon" aria-hidden="true">◐</span>
        <span id="themeToggleLabel">Auto</span>
      </button>
    </div>
    <div class="masthead-rule" aria-hidden="true"></div>
    <p class="masthead-subtitle" id="mastheadSubtitle"></p>
    <p class="masthead-meta" id="mastheadMeta"></p>
    <nav class="masthead-index" id="mastheadIndex" aria-label="Views"></nav>
  </header>

  <div id="leadStat" class="lead-stat" hidden></div>

  <main id="main">
    <section id="viewOverview" class="ndis-section view-overview" aria-labelledby="viewOverviewHeading" hidden></section>
    <section id="sectionPricing" class="ndis-section" aria-labelledby="sectionPricingHeading" hidden></section>
    <section id="sectionExplorer" class="ndis-section" aria-labelledby="sectionExplorerHeading" hidden></section>
    <section id="sectionMoney" class="ndis-section" aria-labelledby="sectionMoneyHeading" hidden></section>
    <section id="sectionLaw" class="ndis-section" aria-labelledby="sectionLawHeading" hidden></section>
    <section id="sectionUpdates" class="ndis-section" aria-labelledby="sectionUpdatesHeading" hidden></section>
    <section id="sectionNumbers" class="ndis-section" aria-labelledby="sectionNumbersHeading" hidden></section>
    <div id="noDataNote"></div>
  </main>

  <footer class="site-footer" id="siteFooter"></footer>
</div>
<!--__BODY_END__-->
<!--__DATA__-->
<!--__JS__-->
</body>
</html>
