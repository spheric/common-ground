name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate dataset
        run: node scripts/validate.mjs
      - name: Validate NDIS data
        run: node scripts/ndis/validate.mjs
      - name: Build single-file app
        run: node scripts/build.mjs
      - name: Stage site (index + NDIS tracker; artifact.html is not published)
        run: |
          mkdir -p _site
          cp dist/index.html _site/index.html
          if [ -f dist/ndis.html ]; then cp dist/ndis.html _site/ndis.html; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
